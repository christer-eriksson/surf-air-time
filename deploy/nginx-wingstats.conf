# Serve the static WingStats page from a Raspberry Pi (or any box) with nginx.
#
#   sudo mkdir -p /var/www/wingstats
#   sudo cp web/index.html web/wingstats.js /var/www/wingstats/
#   sudo cp deploy/nginx-wingstats.conf /etc/nginx/sites-available/wingstats
#   sudo ln -s /etc/nginx/sites-available/wingstats /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Nothing is uploaded: the page only ever GETs these two files, and every
# visitor's sessions stay in their own browser (IndexedDB).
server {
    listen 80;
    server_name wingstats.local;      # or your Pi's hostname / DNS name
    root /var/www/wingstats;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reject anything but reading the two files (belt and braces).
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Let browsers cache the script by version; index.html references
    # wingstats.js?v=<version>, so updates are picked up on the next visit.
    location ~* \.js$ { add_header Cache-Control "public, max-age=86400"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
}
